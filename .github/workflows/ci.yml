name: SentiX Linux CI

on:
  push:
    branches:
      - main
      - feat/**
      - chore/**
  workflow_dispatch:

jobs:
  native:
    name: Native C++20 Fast-Path
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build libssl-dev nlohmann-json3-dev

      - name: Configure, build & test src/native
        run: |
          if [ -f src/native/CMakeLists.txt ]; then
            cmake -S src/native -B build/native -DCMAKE_BUILD_TYPE=Release
            cmake --build build/native -j
            ctest --test-dir build/native --output-on-failure
          else
            echo "Skipping native job until T-03 CMakeLists.txt lands on this branch."
          fi

      - name: Upload sentix-native artifact
        if: ${{ hashFiles('build/native/sentix-native') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: sentix-native-linux
          path: build/native/sentix-native
          if-no-files-found: ignore

  dotnet:
    name: .NET 10 Build, Unit & IPC Tests
    runs-on: ubuntu-24.04
    needs: [native]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download sentix-native artifact if present
        uses: actions/download-artifact@v4
        with:
          name: sentix-native-linux
          path: build/native
        continue-on-error: true

      - name: Build & test SentiX .NET projects
        env:
          SENTIX_NATIVE_BIN: ${{ github.workspace }}/build/native/sentix-native
        run: |
          if [ -f build/native/sentix-native ]; then
            chmod +x build/native/sentix-native
          fi
          if [ -f SentiX.slnx ]; then
            dotnet build SentiX.slnx -c Release
            dotnet test SentiX.slnx -c Release --no-build
          elif [ -f src/dotnet/SentiX.Risk/SentiX.Risk.csproj ] && [ -f tests/SentiX.Risk.Tests/SentiX.Risk.Tests.csproj ]; then
            dotnet build tests/SentiX.Risk.Tests/SentiX.Risk.Tests.csproj -c Release
            dotnet test tests/SentiX.Risk.Tests/SentiX.Risk.Tests.csproj -c Release --no-build
          else
            echo "Skipping dotnet job during bootstrap before .NET projects land."
          fi

      - name: Enforce 100% branch coverage on SentiX.Risk
        if: ${{ hashFiles('tests/SentiX.Risk.Tests/SentiX.Risk.Tests.csproj') != '' }}
        run: |
          dotnet test tests/SentiX.Risk.Tests/SentiX.Risk.Tests.csproj -c Release --collect:"XPlat Code Coverage" --results-directory TestResults/RiskCoverage
          python3 -c '
          import glob, sys, xml.etree.ElementTree as ET
          files = glob.glob("TestResults/RiskCoverage/**/coverage.cobertura.xml", recursive=True)
          assert files, "No cobertura XML found"
          rates = [float(ET.parse(f).getroot().attrib["branch-rate"]) for f in files]
          min_rate = min(rates)
          print(f"SentiX.Risk min branch-rate: {min_rate:.4f}")
          sys.exit(0 if min_rate >= 1.0 else 1)
          '

  web:
    name: React Web Dashboard
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install & build src/web
        run: |
          if [ -f src/web/package.json ]; then
            npm --prefix src/web ci
            npm --prefix src/web run build
          else
            echo "Skipping web job until T-05 src/web/package.json lands on this branch."
          fi
