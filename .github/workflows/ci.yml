name: SentiX Linux CI

on:
  push:
    branches:
      - main
      - feat/**
      - chore/**
  workflow_dispatch:

jobs:
  native:
    name: Native C++20 Fast-Path
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build libssl-dev nlohmann-json3-dev

      - name: Configure, build & test src/native
        run: |
          cmake -S src/native -B build/native -DCMAKE_BUILD_TYPE=Release -DSENTIX_WERROR=ON
          cmake --build build/native -j
          ctest --test-dir build/native --output-on-failure

      - name: Upload sentix-native artifact
        uses: actions/upload-artifact@v4
        with:
          name: sentix-native-linux
          path: build/native/sentix-native
          if-no-files-found: error

  dotnet:
    name: .NET 10 Build, Unit, IPC & Docker Verification
    runs-on: ubuntu-24.04
    needs: [native]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download sentix-native artifact
        uses: actions/download-artifact@v4
        with:
          name: sentix-native-linux
          path: build/native

      - name: Build & test SentiX.slnx (incl. live sentix-native IPC E2E)
        env:
          SENTIX_NATIVE_BIN: ${{ github.workspace }}/build/native/sentix-native
        run: |
          chmod +x build/native/sentix-native
          dotnet build SentiX.slnx -c Release
          dotnet test SentiX.slnx -c Release --no-build --logger "console;verbosity=normal"

      - name: Enforce 100% branch & line coverage on SentiX.Risk
        run: |
          dotnet test tests/SentiX.Risk.Tests/SentiX.Risk.Tests.csproj -c Release --no-build --collect:"XPlat Code Coverage" --results-directory TestResults/RiskCoverage
          python3 -c '
          import glob, sys, xml.etree.ElementTree as ET
          files = glob.glob("TestResults/RiskCoverage/**/coverage.cobertura.xml", recursive=True)
          assert files, "No cobertura XML found"
          roots = [ET.parse(f).getroot() for f in files]
          min_branch = min(float(r.attrib["branch-rate"]) for r in roots)
          min_line = min(float(r.attrib["line-rate"]) for r in roots)
          print(f"SentiX.Risk min branch-rate: {min_branch:.4f}, line-rate: {min_line:.4f}")
          sys.exit(0 if min_branch >= 1.0 and min_line >= 1.0 else 1)
          '

      - name: Verify production Linux Docker images
        run: |
          docker build -f deploy/Dockerfile.native -t sentix-native:ci .
          docker build -f deploy/Dockerfile.host -t sentix-host:ci .

  web:
    name: React Web Dashboard
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install & build src/web
        run: |
          npm --prefix src/web ci
          npm --prefix src/web run build
